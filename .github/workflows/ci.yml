name: CI

# Runs the leakage tests, data-quality tests and training tests on every push to main
# and on every branch named fix/**, and on pull requests into main.
on:
  push:
    branches: [ main, 'fix/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (versions pinned to match requirements.txt)
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy==1.26.4 pandas==2.3.1 scikit-learn==1.8.0 xgboost==2.1.1 \
                      pyarrow==21.0.0 python-dotenv==1.0.0 requests==2.32.3 yfinance==0.2.44

      - name: Run tests
        run: python -m pytest scripts/tests tests -v -k "not end_to_end"